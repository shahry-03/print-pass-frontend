<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before paint to avoid light/dark flash -->
    <script>
      try {
        var raw = localStorage.getItem('printpass-theme');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.state && parsed.state.isDark) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PrintPass — Secure print job management platform. Upload files, get a PIN, print anywhere." />
    <title>PrintPass — Secure Print Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
